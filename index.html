<section class="panel monthly-input-panel">

  <div class="panel-header">

    <div>

      <p class="eyebrow">
        MONTHLY CLOSE
      </p>

      <h3>
        Business Inputs
      </h3>

      <p class="panel-copy">
        Enter operating counts used to calculate efficiency and profitability metrics.
      </p>

    </div>

  </div>


  <form id="monthlyMetricsForm">


    <div class="input-section-title">
      Teams &amp; Player Development
    </div>


    <div class="metrics-input-grid">

      <div>

        <label for="activeTeams">
          Active Teams
        </label>

        <input
          id="activeTeams"
          type="number"
          min="0"
          step="1"
          placeholder="0"
        >

      </div>


      <div>

        <label for="rosteredPlayers">
          Rostered Players
        </label>

        <input
          id="rosteredPlayers"
          type="number"
          min="0"
          step="1"
          placeholder="0"
        >

      </div>


      <div>

        <label for="lessonHours">
          Lesson Hours Completed
        </label>

        <input
          id="lessonHours"
          type="number"
          min="0"
          step="0.5"
          placeholder="0"
        >

      </div>


      <div>

        <label for="programParticipants">
          Camp / Program Participants
        </label>

        <input
          id="programParticipants"
          type="number"
          min="0"
          step="1"
          placeholder="0"
        >

      </div>

    </div>


    <div class="input-section-title">
      Membership &amp; Facility
    </div>


    <div class="metrics-input-grid three-up">

      <div>

        <label for="activeMemberships">
          Active Memberships
        </label>

        <input
          id="activeMemberships"
          type="number"
          min="0"
          step="1"
          placeholder="0"
        >

      </div>


      <div>

        <label for="availableFacilityHours">
          Available Facility Hours
        </label>

        <input
          id="availableFacilityHours"
          type="number"
          min="0"
          step="0.5"
          placeholder="0"
        >

      </div>


      <div>

        <label for="usedFacilityHours">
          Used Facility Hours
        </label>

        <input
          id="usedFacilityHours"
          type="number"
          min="0"
          step="0.5"
          placeholder="0"
        >

      </div>

    </div>


    <div class="form-footer-inline">

      <span
        id="monthlyMetricsMessage"
        class="save-message"
      ></span>


      <button
        id="saveMonthlyMetricsButton"
        type="submit"
        class="primary-button"
      >
        Save Monthly Inputs
      </button>

    </div>

  </form>

</section>
